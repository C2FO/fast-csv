name: Test

on:
  push:
    branches: # Array of patterns that match refs/heads
      - main # Push events on main branch
  pull_request: # Specify a second event with pattern matching
env:
  CI: true

permissions:
  contents: read
  actions: read
  checks: write

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 21.x, 22.x, 24.x]
    steps:
      # https://github.com/actions/checkout/releases/tag/v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Setup pnpm
        # https://github.com/pnpm/action-setup/releases/tag/v6.0.10
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 10.34.5
          run_install: false
      - name: Use Node.js ${{ matrix.node-version }}
        # https://github.com/actions/setup-node/releases/tag/v7.0.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm run format:check
      - run: pnpm run lint
      - run: pnpm run jest
      - run: pnpm run examples
      - run: pnpm run benchmarks
      - name: Coveralls GitHub Action
        # Per Actions best practices, SHA is the safest for third party actions
        # https://github.com/coverallsapp/github-action/releases/tag/v2.3.8
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          flag-name: run-unit-${{ matrix.node-version }}
          parallel: true

  finish:
    needs: unit
    runs-on: ubuntu-latest
    steps:
      - name: Coveralls Finished
        # Per Actions best practices, SHA is the safest for third party actions
        # https://github.com/coverallsapp/github-action/releases/tag/v2.3.8
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329
        with:
          github-token: ${{ secrets.github_token }}
          parallel-finished: true
